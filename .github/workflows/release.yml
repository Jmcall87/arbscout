name: Release website + APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the static website
        run: |
          cd web
          zip -r ../arbscout-website.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: arbscout-website
          path: arbscout-website.zip
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arbscout-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    needs: [package-web, build-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release with both downloads
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arbscout-website/arbscout-website.zip
            dist/arbscout-apk/app-debug.apk
          generate_release_notes: true
